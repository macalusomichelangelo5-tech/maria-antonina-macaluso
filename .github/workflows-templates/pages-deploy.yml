name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Patch next.config.ts for GitHub Pages static export (with custom domain)
        run: |
          # Cambia output da standalone a export (static HTML)
          sed -i 's/output: "standalone"/output: "export"/' next.config.ts
          # NON aggiungere basePath — custom domain serve da root
          # (maria-antonina-macaluso.it → no sottodirectory)
          # Verifica modifica
          grep -E "output|basePath" next.config.ts | head -5
          echo "✓ next.config.ts patchato per custom domain (no basePath)"

      - name: Build static export
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SITE_URL: 'https://maria-antonina-macaluso.it'

      - name: Add .nojekyll file (bypass Jekyll processing)
        run: touch out/.nojekyll

      - name: Copy CNAME file to output (custom domain binding)
        run: cp public/CNAME out/CNAME

      - name: Verify CNAME in output
        run: cat out/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
