name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Patch next.config.ts for GitHub Pages static export
        run: |
          # Cambia output da standalone a export
          sed -i 's/output: "standalone"/output: "export"/' next.config.ts
          # Aggiungi basePath per sottodirectory GitHub Pages
          if ! grep -q "basePath" next.config.ts; then
            sed -i '/images: {/i\    basePath: "/maria-antonina-macaluso",\n    assetPrefix: "/maria-antonina-macaluso/",' next.config.ts
          fi
          # Verifica modifica
          grep -E "output|basePath|assetPrefix" next.config.ts | head -5

      - name: Build static export
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SITE_URL: 'https://michelangelomacaluso1502-oss.github.io/maria-antonina-macaluso'

      - name: Add .nojekyll file (bypass Jekyll processing)
        run: touch out/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
